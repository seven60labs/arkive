# ARKive "Maslow index": the whole archive sorted by Maslow's hierarchy of needs, bottom-up.
# Built by opt/mini-web/build_maslow.py into /srv/archive/generated/maslow.html, served at :8080/maslow.
# Stay Alive (stayalive.yaml) already covers level 1 and half of level 2 article-by-article; each level
# links to the matching Stay Alive sections instead of repeating them ('stayalive:' = section ids).
# Item kinds (anything not installed on this device, or not answering 200, is hidden automatically):
#   zim:   <ZIM name WITHOUT the _YYYY-MM date>  [path: <article>]  (whole collection when no path)
#   match: <regex over ZIM names>  -> one entry per installed match (long lists fold into a <details>)
#   pdf:   <id from manuals/official/manifest.json>
#   file:  <path under /srv/archive/manuals, served by the :8080 file browser>
#   app:   <path on the :8080 panel>
# 'label' is what the reader sees (default: the ZIM title); 'note' is the grey second line.
# After editing: python3 build_maslow.py --export-json  (writes maslow.json for ARKive:zero, no PyYAML there)
levels:
  - id: physiological
    n: 1
    title: Physiological
    blurb: "Water, food, warmth, fire, sanitation and medicine: what the body needs first."
    stayalive: [first-aid, water, shelter, fire, food, sanitation]
    groups:
      - title: Water
        items:
          - {zim: zimgit-water_en, label: "Water Treatment Library"}
          - {pdf: epa-disinfection}
          - {pdf: tb-med-577}
          - {pdf: atp-4-44}
      - title: Food and canning
