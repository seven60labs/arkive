# ARKive "Stay Alive" start page. Built by opt/mini-web/build_stayalive.py into a page served at :8080/stay-alive.
# Organised by NEED, links in priority order: official manual chapter first, then the best offline articles.
# Link kinds (anything not installed on this device, or not answering 200, is hidden automatically):
#   pdf:  <id from manuals/catalog.json>   page: <PDF page number for #page=>   (Official Manuals collection)
#   zim:  <ZIM name WITHOUT the _YYYY-MM date>   path: <article path inside the ZIM>
#   app:  <path on the ARKive :8080 panel>   (e.g. terrain)
# 'label' is what the reader sees; 'source' overrides the automatic source label.
sections:
  - id: first-aid
    title: First aid & trauma
    blurb: Bleeding, breathing, burns, broken bones, cold & heat injuries
    links:
      - {pdf: atp-4-02-11, page: 57, label: "Stop massive bleeding (tourniquet, packing, pressure)"}
